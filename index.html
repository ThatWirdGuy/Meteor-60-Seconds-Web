<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <title>Meteor 60 Seconds!</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/gh/ThatWirdGuy/Meteor-60-Seconds-Web@main/Build/UnityLoader.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: black; }
    #gameContainer { width: 100%; height: 100%; }
    #loadingScreen {
      position: fixed;
      inset: 0;
      background: black;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      font-family: 'Inter', sans-serif;
      font-size: 1.5rem;
      font-weight: 300;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <div id="loadingScreen">Loading <span id="loadMB">0.0</span> / 17.7 MB</div>
  <div id="gameContainer"></div>
  <script>
    var TOTAL_MB = 17.7

    function myProgress(gameInstance, progress) {
      document.getElementById('loadMB').innerText = (progress * TOTAL_MB).toFixed(1);
      if (progress === 1) {
        document.getElementById('loadingScreen').style.display = 'none';
      }
    }

    var gameInstance = UnityLoader.instantiate(
      "gameContainer",
      "https://cdn.jsdelivr.net/gh/ThatWirdGuy/Meteor-60-Seconds-Web@main/Build/FIles.json",
      { onProgress: myProgress }
    );
  </script>
</body>
</html>
