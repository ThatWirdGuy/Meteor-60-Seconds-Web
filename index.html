<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Meteor 60 seconds!</title>
    <link rel="shortcut icon" href="https://cdn.jsdelivr.net/gh/ThatWirdGuy/Metor-60-Seconds-Web@main/TemplateData/favicon.ico">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/ThatWirdGuy/Metor-60-Seconds-Web@main/TemplateData/style.css">
    <script src="https://cdn.jsdelivr.net/gh/ThatWirdGuy/Metor-60-Seconds-Web@main/TemplateData/UnityProgress.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/ThatWirdGuy/Metor-60-Seconds-Web@main/Build/UnityLoader.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; }
      #gameContainer { width: 100%; height: 100%; }
      #loadingScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: black; color: white; display: flex;  align-items: center; justify-content: center; z-index: 10; font-size: 2rem;}
    </style>
    <script>
      var gameInstance = UnityLoader.instantiate(
        "gameContainer",
        "https://cdn.jsdelivr.net/gh/ThatWirdGuy/Metor-60-Seconds-Web@main/Build/FIles.json",
        { onProgress: UnityProgress }
      );
    </script>
  </head>
  <body>
    <div id="LoadingScreen"></div>
    <div id="gameContainer">
      <h1>Loading... <span id="loadPercent">0</span>%</h1>
    </div>

      <script>
    function myProgress(gameInstance, progress) {
      if (progress === 1) {
        document.getElementById('loadingScreen').style.display = 'none';
      }
    }

    var gameInstance = UnityLoader.instantiate(
      "gameContainer",
      "https://cdn.jsdelivr.net/gh/ThatWirdGuy/Metor-60-Seconds-Web@main/Build/Files.json",
      { onProgress: myProgress }
    );
  </script>
  </body>
</html>
